# AlphaOmega Lightsail nginx reverse proxy.
#
# Primary target:
# - Host nginx: http://127.0.0.1:9090
#
# If this file is used inside the shared Docker nginx attached to levelup-net,
# replace the upstream server with:
#   server alphaomega-app:9090;

upstream alphaomega_backend {
    server 127.0.0.1:9090;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name alphaomega.ashwoodfriends.com;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://alphaomega_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

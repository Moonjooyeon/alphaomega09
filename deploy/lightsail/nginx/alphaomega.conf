# AlphaOmega config for ukdong-black/lightsail-nginx-configure af-levelup.
# This file assumes the shared Docker nginx is attached to levelup-net.
# AlphaOmega containers:
# - alphaomega-web:80
# - alphaomega-backend:9090

server {
    listen 80;
    server_name alphaomega.ashwoodfriends.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name alphaomega.ashwoodfriends.com;

    ssl_certificate /etc/letsencrypt/live/alphaomega.ashwoodfriends.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alphaomega.ashwoodfriends.com/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 8m;

    location = /health {
        set $alphaomega_backend alphaomega-backend:9090;
        proxy_pass http://$alphaomega_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        set $alphaomega_backend alphaomega-backend:9090;
        proxy_pass http://$alphaomega_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        set $alphaomega_web alphaomega-web:80;
        proxy_pass http://$alphaomega_web;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
